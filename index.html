<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>시험날 D-DAY! 국가기술자격 시험장 RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c14e;--navy:#1b2a4a;--navy2:#2a3f6b;--mint:#35c495;--pink:#ff6f91;--red:#e8513d;--sky:#bfe3f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3e6;font-family:'Jua',system-ui,sans-serif;color:#fff;touch-action:none;-webkit-text-size-adjust:100%}
button,.slot,.ch,#dlg,#quest,.op{touch-action:manipulation}
canvas#cv{position:fixed;inset:0;display:block}
.ui{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
.ui > *{pointer-events:auto}
.panel{background:linear-gradient(180deg,var(--navy2),var(--navy));border:3px solid var(--gold);border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.08)}
/* status */
#status{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:8px;padding:6px 10px 7px 6px;align-items:center;width:218px}
#pf{width:60px;height:60px;border-radius:12px;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#ffe9a8,#f2a65a)}
.stat{flex:1;min-width:0}
.stat .nm{font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .job{font-size:15px;color:#ffe08a;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{display:flex;align-items:center;gap:4px;font-size:13px;margin-top:3px}
.gauge span{width:42px;color:#cfe0ff}
.gauge .g{flex:1;height:11px;background:#0d1730;border:1.5px solid #000;border-radius:5px;overflow:hidden}
.gauge .g i{display:block;height:100%;transition:width .4s}
#gPrep i{background:linear-gradient(90deg,#4fa3ff,#7fd0ff)}
#gMent i{background:linear-gradient(90deg,#ff6f91,#ffb0c4)}
/* clock */
#clock{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 8px);padding:4px 12px 6px;text-align:right;min-width:132px}
#clock .ampm{font-size:15px;color:#ffe08a}
#clock .tm{font-family:'Black Han Sans';font-size:38px;line-height:1;letter-spacing:1px}
#clock .left{font-size:15px;color:#cfe0ff}
#clock.danger .tm{color:#ff8a7a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
#quest{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 100px);width:206px;padding:8px 11px;font-size:16px}
#quest .qt{color:var(--gold);font-size:16px;margin-bottom:3px}
#quest .qn{font-size:20px;line-height:1.3}
#quest .qs{font-size:16px;color:#dfe8ff;margin-top:3px;line-height:1.4}
#quest .qt{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#qTog{font-size:13px;color:#cfe0ff;background:#0f1b36;border-radius:99px;padding:2px 9px}
#quest.min{width:auto;max-width:206px}
#quest.min .qs,#quest.min .done{display:none}
#quest.min .qn{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quest{cursor:pointer}
#quest .done{font-size:14px;color:#8fe3c0;margin-top:5px;line-height:1.5}
/* hotbar */
#hotbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);display:flex;gap:5px;padding:6px}
.slot{width:50px;height:50px;border-radius:10px;background:#0f1b36;border:2px solid #4a5f8f;display:flex;align-items:center;justify-content:center;font-size:29px;position:relative;cursor:pointer}
.slot small{position:absolute;left:3px;top:0;font-size:11px;color:#8aa0cc}
.slot.full{border-color:var(--gold);background:#1d2c52}
.slot.full:active{transform:scale(.94)}
/* controls */
#joy{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:128px;height:128px;border-radius:50%;background:rgba(27,42,74,.35);border:3px solid rgba(255,255,255,.55);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#d8e4ff);border:3px solid var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#abtn{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom) + 98px);width:92px;height:92px;border-radius:50%;border:4px solid var(--navy);background:radial-gradient(circle at 40% 35%,#ffe48a,#f2a93b);box-shadow:0 5px 0 var(--navy);font-family:'Black Han Sans';font-size:30px;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;touch-action:none}
#abtn small{font-family:'Jua';font-size:15px;margin-top:3px;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#abtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
#abtn.dim{filter:grayscale(.7) brightness(.85)}
/* toast */
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:90%}
.tst{background:rgba(15,27,54,.94);border:2px solid var(--gold);border-radius:99px;padding:10px 20px;font-size:19px;animation:tin .25s ease, tout .4s ease 2.2s forwards;text-align:center}
@keyframes tin{from{transform:translateY(-8px) scale(.9);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
/* dialog */
#dlg{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:620px;margin:0 auto;display:none;padding:12px 14px 12px 12px;gap:12px;cursor:pointer;z-index:5}
#dlg.show{display:flex;animation:tin .2s}
#dp{width:92px;height:92px;flex:none;border-radius:12px;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#ffe9a8,#f2a65a)}
#dlg .body{flex:1;min-width:0}
#dName{display:inline-block;background:var(--gold);color:var(--navy);border-radius:8px;padding:2px 10px;font-size:18px;margin-bottom:6px}
#dText{font-size:23px;line-height:1.5;min-height:66px;white-space:pre-line}
#dNext{text-align:right;font-size:17px;color:var(--gold);animation:blink 1s infinite}
#dChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#dChoices button,.btn{font:inherit;font-size:21px;text-align:left;padding:13px 15px;border-radius:10px;border:2px solid var(--gold);background:#fff8e1;color:var(--navy);cursor:pointer;box-shadow:0 3px 0 #b8862a}
#dChoices button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8862a}
/* item popup */
#pop{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);width:min(360px,94%);padding:12px;display:none;z-index:4}
#pop.show{display:block;animation:tin .2s}
#pop .pi{font-size:40px;float:left;margin-right:10px}
#pop .pn{font-size:23px;color:var(--gold)}
#pop .pd{font-size:19px;line-height:1.45;color:#dfe8ff;margin-top:3px;clear:right}
#pop .row{display:flex;gap:6px;margin-top:10px;clear:both}
#pop .row .btn{flex:1;text-align:center;padding:8px}
/* screens */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.screen.show{display:flex}
.dim{background:rgba(10,20,40,.55)}
.box{width:min(440px,100%);padding:18px;animation:tin .3s;max-height:100%;overflow:auto}
.logo{text-align:center}
.logo .sub{display:inline-block;background:var(--gold);color:var(--navy);border-radius:99px;padding:3px 12px;font-size:13px}
.logo h1{font-family:'Black Han Sans';font-weight:400;font-size:54px;line-height:1;margin:10px 0 2px;color:#fff;text-shadow:0 4px 0 var(--navy),0 0 0 #000,3px 3px 0 #f2a93b,-2px -2px 0 var(--navy)}
.logo h1 em{font-style:normal;color:var(--gold)}
.logo p{font-size:20px;color:#dfe8ff;line-height:1.6}
.big-btn{display:block;width:100%;margin-top:12px;font-family:'Black Han Sans';font-size:25px;padding:14px;border-radius:14px;border:3px solid var(--navy);background:linear-gradient(180deg,#ffe48a,#f2a93b);color:var(--navy);box-shadow:0 5px 0 var(--navy);cursor:pointer}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.big-btn.blue{background:linear-gradient(180deg,#7fc4ff,#3d86e8);color:#fff}
.sec{font-size:22px;color:var(--gold);margin:14px 0 8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.choices{grid-template-columns:repeat(2,minmax(0,1fr))!important}.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.ch{min-width:0}
.ch{border:2.5px solid #4a5f8f;background:#0f1b36;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;font-size:19px;line-height:1.3;word-break:keep-all}
.choices.c3 .ch{font-size:16px;padding:7px 3px}
.ch b{display:block;font-size:28px;font-weight:400}
.ch canvas{width:64px;height:64px;display:block;margin:0 auto 2px}
.ch.on{border-color:var(--gold);background:#2a3f6b;box-shadow:0 0 0 3px rgba(242,193,78,.35)}
.note{font-size:15px;color:#a9b9da;text-align:center;margin-top:12px;line-height:1.5}
.note a{color:#ffe08a}
/* CBT */
#cbt .win{width:min(720px,100%);background:#eef3f9;color:#1b2a4a;border-radius:10px;border:3px solid #2c4a7a;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.35);animation:tin .3s;font-family:'Jua'}
#cbt .hd{background:linear-gradient(180deg,#3a69b0,#2c4a7a);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:17px;gap:8px}
#cbt .hd b{font-family:'Black Han Sans';font-weight:400;font-size:20px;white-space:nowrap}
#cbt .tmr{background:#0f1b36;border-radius:6px;padding:3px 10px;font-family:'Black Han Sans';font-size:25px;color:#ffe08a;white-space:nowrap}
#cbt .bd{display:flex;gap:10px;padding:10px}
#cbt .side{width:140px;flex:none;background:#fff;border:1.5px solid #b9c8dd;border-radius:8px;padding:8px;font-size:14px;text-align:center}
#cbt .side canvas{width:72px;height:72px;border:1.5px solid #b9c8dd;border-radius:6px;background:#dfe8f3}
#cbt .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
#cbt .nums span{border:1.5px solid #b9c8dd;border-radius:4px;padding:3px 0;font-size:14px;background:#f5f8fc}
#cbt .nums span.cur{border-color:#3a69b0;background:#dbe8ff}
#cbt .nums span.o{background:#cff3e3;border-color:#35c495}
#cbt .nums span.x{background:#fddcd5;border-color:#e8513d}
#cbt .main{flex:1;min-width:0;background:#fff;border:1.5px solid #b9c8dd;border-radius:8px;padding:12px}
#cbt .qno{font-size:17px;color:#3a69b0}
#cbt .qq{font-size:25px;line-height:1.5;margin:6px 0 10px;word-break:keep-all}
#cbt .op{display:block;width:100%;text-align:left;font:inherit;font-size:21px;padding:13px 14px;margin-top:7px;border:2px solid #c9d5e6;border-radius:8px;background:#f8fbff;color:#1b2a4a;cursor:pointer}
#cbt .op.ox{display:inline-block;width:calc(50% - 4px);text-align:center;font-family:'Black Han Sans';font-size:38px;padding:8px}
#cbt .op.ox+.op.ox{margin-left:8px}
#cbt .op.r{background:#cff3e3;border-color:#35c495}
#cbt .op.w{background:#fddcd5;border-color:#e8513d}
#cbt .fb{margin-top:10px;font-size:19px;line-height:1.5;padding:8px 10px;border-radius:8px}
#cbt .fb.r{background:#e6f8f0;border:1.5px solid #35c495}
#cbt .fb.w{background:#fdeeea;border:1.5px solid #e8513d}
#cbt .nx{margin-top:10px;width:100%;text-align:center;font-family:'Black Han Sans';font-size:23px;padding:12px;border-radius:8px;border:none;background:#3a69b0;color:#fff;cursor:pointer}
#cbt .tbar{height:6px;background:#dbe3ee;border-radius:3px;overflow:hidden;margin-top:6px}
#cbt .tbar i{display:block;height:100%;background:#f2a93b}
@media (max-width:520px){#cbt .bd{flex-direction:column}#cbt .side{width:auto;display:flex;align-items:center;gap:8px;text-align:left}#cbt .side canvas{width:48px;height:48px}#cbt .nums{margin:0 0 0 auto;width:150px}}
/* result / end */
.res{text-align:center}
.res .stamp{display:inline-block;font-family:'Black Han Sans';font-size:44px;padding:4px 22px;border:5px solid;border-radius:14px;transform:rotate(-6deg);margin:6px 0 10px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
.res .score{font-family:'Black Han Sans';font-size:58px;line-height:1;color:var(--gold)}
.stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.kv{display:flex;justify-content:space-around;margin:10px 0;font-size:17px;color:#cfe0ff}
.kv b{display:block;font-size:22px;color:#fff;font-family:'Black Han Sans';font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:8px 0}
.badges span{font-size:16px;background:#0f1b36;border:1.5px solid var(--gold);border-radius:99px;padding:3px 9px}
.tips{text-align:left;font-size:18px;line-height:1.7;background:#0f1b36;border-radius:10px;padding:10px 12px;margin-top:10px;color:#dfe8ff}
.go-ic{font-size:64px;text-align:center}
.go-t{font-family:'Black Han Sans';font-size:36px;color:#ff8a7a;text-align:center;margin:4px 0 10px}
.why{background:#3a1d26;border:2px solid #e8513d;border-radius:10px;padding:10px 12px;font-size:20px;line-height:1.55}
.tip{background:#3a3218;border:2px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:19px;line-height:1.55;margin-top:8px}
.warn{background:#5a1010;border:2.5px solid #ff5a4a;border-radius:10px;padding:10px 12px;font-size:17px;line-height:1.55;margin-top:8px;color:#ffe2dc;font-size:19px}
.cheer-ic{font-size:60px;line-height:1.1}
.cheer-t{font-family:'Black Han Sans';font-size:34px;line-height:1.25;color:var(--gold);margin:10px 0 8px}
.cheer-m{font-size:20px;line-height:1.55;color:#fff}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#copyMsg{font-size:16px;color:#8fe3c0;text-align:center;margin-top:6px;min-height:16px;word-break:break-all}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="ui" id="hud" style="display:none">
  <div id="status" class="panel">
    <canvas id="pf" width="112" height="112"></canvas>
    <div class="stat">
      <div class="nm" id="hName">수험생 Lv.1</div>
      <div class="job" id="hJob">-</div>
      <div class="gauge" id="gPrep"><span>준비도</span><div class="g"><i></i></div></div>
      <div class="gauge" id="gMent"><span>멘탈</span><div class="g"><i></i></div></div>
    </div>
  </div>
  <div id="clock" class="panel">
    <div class="ampm" id="cAp">D-DAY · 오전</div>
    <div class="tm" id="cTime">07:40</div>
    <div class="left" id="cLeft">입실 마감 09:00</div>
  </div>
  <div id="quest" class="panel">
    <div class="qt">📜 퀘스트 <span id="qTog">▲ 접기</span></div>
    <div class="qn" id="qName">-</div>
    <div class="qs" id="qSub"></div>
    <div class="done" id="qDone"></div>
  </div>
  <div id="toast"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="abtn">A<small id="aLbl">행동</small></div>
  <div id="hotbar" class="panel"></div>
  <div id="pop" class="panel"></div>
  <div id="dlg" class="panel">
    <canvas id="dp" width="168" height="168"></canvas>
    <div class="body">
      <div id="dName"></div>
      <div id="dText"></div>
      <div id="dChoices"></div>
      <div id="dNext">▼ 터치</div>
    </div>
  </div>
</div>

<!-- title -->
<div class="screen show" id="sTitle">
  <div class="box panel logo">
    <span class="sub">국가기술자격 시험장 RPG</span>
    <h1>시험날<br><em>D-DAY!</em></h1>
    <p style="word-break:keep-all"><b style="color:#fff">오늘은 드디어 자격증 시험을 치는 날!</b><br>준비물을 챙기고 늦지 않게 시험장에 가서 CBT 시험까지 무사히 마칠 수 있을까?</p>
    <button class="big-btn" id="btnStart">▶ 게임 시작</button>
    <div class="note">이동: 왼쪽 조이스틱 (PC는 방향키)<br>행동: 오른쪽 A 버튼 (PC는 스페이스)</div>
  </div>
</div>
<!-- setup -->
<div class="screen dim" id="sSetup">
  <div class="box panel">
    <div class="sec" style="margin-top:0">① 내 캐릭터</div>
    <div class="choices" id="lookCh"></div>
    <div class="sec">② 응시 종목 (상시 12종목)</div>
    <div class="choices" id="jobCh"></div>
    <div class="sec">③ 시험 시간 (입실 시간)</div>
    <div class="choices c3" id="sesCh"></div>
    <div class="note" style="margin-top:6px">입실 시간으로부터 20분이 지나면 입실할 수 없어요.</div>
    <button class="big-btn" id="btnGo">시험날 시작!</button>
  </div>
</div>
<!-- cbt -->
<div class="screen dim" id="cbt"><div class="win" id="cbtWin"></div></div>
<!-- result / end -->
<div class="screen dim" id="sEnd"><div class="box panel" id="endBox"></div></div>

<script>
const $=s=>document.querySelector(s);
/* ============ 데이터 ============ */
const JOBS=[
  {id:'kor',icon:'🍚',name:'한식조리기능사'},{id:'west',icon:'🍝',name:'양식조리기능사'},
  {id:'jpn',icon:'🍣',name:'일식조리기능사'},{id:'chn',icon:'🥟',name:'중식조리기능사'},
  {id:'confec',icon:'🎂',name:'제과기능사'},{id:'bread',icon:'🍞',name:'제빵기능사'},
  {id:'hair',icon:'💇',name:'미용사(일반)'},{id:'skin',icon:'🧖',name:'미용사(피부)'},
  {id:'nail',icon:'💅',name:'미용사(네일)'},{id:'makeup',icon:'💄',name:'미용사(메이크업)'},
  {id:'exc',icon:'🏗️',name:'굴착기운전기능사'},{id:'fork',icon:'🚜',name:'지게차운전기능사'},
];
const LOOKS={
  p1:{skin:'#ffd9b8',hair:'#6b4426',top:'#3d7be0',pants:'#2b3550',hat:'#2a2e38',bag:'#efe4cf',style:'cap',label:'청년',who:'청년 수험생'},
  p2:{skin:'#ffdcc2',hair:'#2a2230',top:'#ffc93c',pants:'#3a4a6b',bag:'#d65a4a',style:'bob',label:'대학생',who:'대학생 수험생'},
  p3:{skin:'#f3cba5',hair:'#b9b9b9',top:'#6b8e5a',pants:'#4a4038',style:'short',glasses:true,label:'중장년',who:'중장년 수험생'},
  p4:{skin:'#ffe0c6',hair:'#1f1a1a',top:'#2b3f75',pants:'#2b3f75',bag:'#3a3a3a',style:'short',tie:'#c23b3b',label:'학생',who:'학생 수험생',minor:true},

const hash=(i,j)=>(((i*73856093)^(j*19349663))>>>0);
function buildMap(){
  G=[...Array(H)].map(()=>Array(W).fill('.'));
  const set=(x,y,c)=>{G[y][x]=c};
  for(let i=0;i<W;i++){set(i,0,'T');set(i,H-1,'T')} for(let j=0;j<H;j++){set(0,j,'T');set(W-1,j,'T')}
  for(let j=1;j<H-1;j++)for(let i=1;i<W-1;i++) if(hash(i,j)%9===0) set(i,j,'p');
  for(let x=1;x<=7;x++)for(let y=1;y<=6;y++){let c='o';if(y===1||x===1)c='H';else if(y===6||x===7)c='h';set(x,y,c)}
  set(7,4,'o');set(4,2,'b');set(2,4,'k');
  const line=(x1,y1,x2,y2)=>{let x=x1,y=y1;for(;;){set(x,y,'r');if(x===x2&&y===y2)break;x+=Math.sign(x2-x);y+=Math.sign(y2-y)}};
  line(8,4,16,4);line(16,4,16,10);line(16,10,8,10);line(8,10,8,14);line(8,14,19,14);line(19,14,19,18);
  for(let x=6;x<=18;x++)for(let y=16;y<=22;y++){let c='f';if(y===16||x===6)c='X';else if(y===22||x===18)c='x';set(x,y,c)}
  set(18,18,'D');
  for(let y=17;y<=21;y++)set(12,y,'w');set(12,18,'E');set(12,19,'E');
  for(const x of [8,10])for(const y of [19,21])set(x,y,'c');
  set(10,17,'L');set(13,17,'Q');
  for(const x of [13,14,15,16])set(x,20,'B');
  [[10,2],[13,1],[20,8],[22,12],[12,7],[3,9],[2,12],[4,14],[11,12],[15,8],[10,7],[21,16],[22,20],[3,18],[2,21],[4,21],[20,21],[14,11],[2,16]].forEach(([x,y])=>set(x,y,'T'));
  [[12,5],[17,8],[10,13],[15,15]].forEach(([x,y])=>set(x,y,'l'));
  set(9,5,'S');
  // 실기시험장 (오픈 준비 중)
  for(let x=19;x<=22;x++)for(let y=1;y<=4;y++)set(x,y,'Y');
  set(20,4,'Z');line(16,5,20,5);set(21,5,'K');set(22,5,'K');set(18,6,'K');
  set(17,7,'V');
}

function beep(f=660,d=.08,type='square',v=.05){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const jingle=()=>{beep(660,.09);setTimeout(()=>beep(880,.09),90);setTimeout(()=>beep(1175,.14),180)};

let DLG=null;
function say(steps,onEnd){DLG={steps,i:0,onEnd};$('#dlg').classList.add('show');showStep()}
function showStep(){
  const s=DLG.steps[DLG.i];
  $('#dName').style.display=s.who?'':'none';$('#dName').textContent=s.who?CH[s.who].name:'';
  $('#dp').style.display=s.who?'':'none';if(s.who)drawPortrait($('#dp'),s.who);
  DLG.full=s.text;DLG.n=0;DLG.typing=true;$('#dText').textContent='';$('#dChoices').innerHTML='';$('#dNext').style.visibility='hidden';
}
function finishType(){
  DLG.typing=false;$('#dText').textContent=DLG.full;const s=DLG.steps[DLG.i];
  if(s.choices){s.choices.forEach(c=>{const b=document.createElement('button');b.textContent=c.t;b.onclick=e=>{e.stopPropagation();beep(740,.05);closeDlg();c.fn&&c.fn()};$('#dChoices').appendChild(b)})}
  else $('#dNext').style.visibility='visible';
}
function advance(){
  if(!DLG)return;if(DLG.typing){finishType();return}
  const s=DLG.steps[DLG.i];if(s.choices)return;
  beep(520,.03);DLG.i++;
  if(DLG.i>=DLG.steps.length){const cb=DLG.onEnd;closeDlg();cb&&cb()}else showStep();
}
function closeDlg(){DLG=null;$('#dlg').classList.remove('show')}
$('#dlg').addEventListener('click',advance);

function getTarget(){
  let best=null,bd=99;
  for(const it of WITEMS){if(it.cool>0)continue;const d=Math.hypot(it.x-P.x,it.y-P.y);if(d<.95&&d<bd){bd=d;best={type:'item',it,label:ITEMS[it.id].icon+' '+ITEMS[it.id].name,btn:'줍기',x:it.x,y:it.y}}}
  for(const n of NPCS){const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<1.45&&d<bd){bd=d;best={type:'npc',n,label:'대화',x:n.x,y:n.y}}}
  const ti=Math.floor(P.x),tj=Math.floor(P.y);
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
    const i=ti+di,j=tj+dj;if(i<0||j<0||i>=W||j>=H)continue;const c=G[j][i];
    const lab={Z:'실기시험장',V:'자판기',k:'서랍 열기',b:'살펴보기',c:(i===10&&j===19)?'내 자리 앉기':'살펴보기',L:'전자기기 제출',S:'표지판 읽기',Q:'안내문 읽기',B:'의자에 앉기',E:F.callIn?null:'시험실 문'}[c];
    if(c==='B'&&NPCS.some(n=>n.sit&&Math.floor(n.x)===i&&Math.floor(n.y)===j))continue;
    if(!lab)continue;const d=Math.hypot(i+.5-P.x,j+.5-P.y);
    if(d<1.3&&d<bd){bd=d;best={type:'tile',c,i,j,label:lab,x:i+.5,y:j+.5}}
  }
  return best;
}
function act(){
  if(MODE!=='play')return;

}

function blocked(x,y){
  const r=.26;
  for(const [ox,oy] of [[-r,-r],[r,-r],[-r,r],[r,r]]){const tx=Math.floor(x+ox),ty=Math.floor(y+oy);if(tx<0||ty<0||tx>=W||ty>=H)return true;const gc=G[ty][tx];if(BLOCK.has(gc)||(gc==='E'&&!F.callIn))return true}
  for(const n of NPCS)if(Math.hypot(n.x-x,n.y-y)<.55)return true;
  return false;
}
let lastTick=-1;
function update(dt){
  if(!F.arrived){
    TIME+=dt*(DEADLINE-TIME_START)/300; // 집 출발~입실 마감까지 실제 5분
    const m=Math.floor(TIME);if(m!==lastTick){lastTick=m;updateHUD();if(m%2===0){SNAPS.push(snap());if(SNAPS.length>60)SNAPS.shift()}
      if(m===ENTRY){toast('⏰ 입실 시간이에요! 20분이 지나면 입실할 수 없어요');beep(440,.2)}
      if(m===DEADLINE-10){toast('⚠️ 입실 마감 10분 전! 서둘러!');beep(440,.2)}}
    if(TIME>=DEADLINE){gameOver('late');return}
  }
  let sx=JV.x+(K.r?1:0)-(K.l?1:0),sy=JV.y+(K.d?1:0)-(K.u?1:0);
  const m=Math.hypot(sx,sy);P.moving=m>.18;
  if(P.moving){
    let wx=sx/2+sy,wy=sy-sx/2;const wl=Math.hypot(wx,wy);wx/=wl;wy/=wl;
    const sp=3.4*Math.min(1,m)*dt;
    const nx=P.x+wx*sp;if(!blocked(nx,P.y))P.x=nx;
    const ny=P.y+wy*sp;if(!blocked(P.x,ny))P.y=ny;
    if(Math.abs(sx)>.25)P.flip=sx<0;
    P.face=sy<-.3?'up':(sy>.3?'down':P.face);P.sit=false;
  }
  for(const it of WITEMS)if(it.cool>0&&Math.hypot(it.x-P.x,it.y-P.y)>1.1)it.cool=0;
  if(!F.leftHome&&P.x>=8){F.leftHome=1;updateHUD();toast('🚶 출발! 길을 따라 시험장으로')}
  if(!F.arrived&&P.x<18&&P.x>=13&&P.y>=17&&P.y<22)onArrive();
  if(!F.entered&&P.x<12&&P.x>=7&&P.y>=17&&P.y<22)onEnter();
  for(const n of NPCS){if(n.sit)continue;const d=Math.hypot(n.x-P.x,n.y-P.y);if(d<3){const s=(P.x-n.x)-(P.y-n.y);n.flip=s<0;n.face=((P.x-n.x)+(P.y-n.y))<-.2?'up':'down'}}
  TARGET=getTarget();
  $('#aLbl').textContent=TARGET?(TARGET.btn||TARGET.label):'행동';$('#abtn').classList.toggle('dim',!TARGET);
}

  const lc=$('#lookCh');lc.innerHTML='';
  ['p1','p2','p3','p4'].map(k=>[k,LOOKS[k].label]).forEach(([k,n])=>{const d=document.createElement('div');d.className='ch'+(LOOK===k?' on':'');const c=document.createElement('canvas');c.width=128;c.height=128;d.appendChild(c);d.appendChild(document.createTextNode(n));
    d.onclick=()=>{LOOK=k;setupScreen()};lc.appendChild(d);const cc=c.getContext('2d');drawChar(cc,64,118,LOOKS[k],{face:'down'},0,2)});
  const sc=$('#sesCh');sc.innerHTML='';
  SESSIONS.forEach(x=>{const d=document.createElement('div');d.className='ch'+(SESSION===x?' on':'');d.innerHTML=`<b style="font-size:22px;font-family:'Black Han Sans'">${x.n}</b>${fmtS(x.t)}`;d.onclick=()=>{SESSION=x;setupScreen()};sc.appendChild(d)});
  const jc=$('#jobCh');jc.innerHTML='';
  JOBS.forEach(j=>{const d=document.createElement('div');d.className='ch'+(JOB.id===j.id?' on':'');d.innerHTML=`<b>${j.icon}</b>${j.name}`;d.onclick=()=>{JOB=j;setupScreen()};jc.appendChild(d)});
}
$('#btnStart').onclick=()=>{beep(660,.06);$('#sTitle').classList.remove('show');setupScreen();$('#sSetup').classList.add('show')};
$('#btnGo').onclick=()=>{jingle();$('#sSetup').classList.remove('show');buildMap();newGame()};
requestAnimationFrame(frame);
</script>
</body>
</html>
